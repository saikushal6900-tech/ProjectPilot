<text x="70" y="700" font-family="Inter, Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#85899B" text-anchor="start">INTERACTION SPEC</text>
<text x="80" y="740" font-family="Inter, Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202438" text-anchor="start">•  Dashboard → Projects: click View all or a project card.</text>
<text x="80" y="762" font-family="Inter, Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202438" text-anchor="start">•  Projects → Project details: click a project card.</text>
<text x="80" y="784" font-family="Inter, Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202438" text-anchor="start">•  Project details → Task drawer: click a task row; overlay slides in from right.</text>
<text x="80" y="806" font-family="Inter, Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202438" text-anchor="start">•  Task checkbox: toggle completion; update progress indicator and completed count.</text>
<text x="80" y="828" font-family="Inter, Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202438" text-anchor="start">•  Task board: drag cards between To do, In progress, In review and Completed.</text>
<text x="80" y="850" font-family="Inter, Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202438" text-anchor="start">•  Calendar event: click event to open related project/task detail.</text>
<text x="80" y="872" font-family="Inter, Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202438" text-anchor="start">•  AI Assistant: prompt chips populate the composer; send opens assistant response state.</text>
<text x="80" y="894" font-family="Inter, Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202438" text-anchor="start">•  Global + action: open Create project / Create task modal.</text>
